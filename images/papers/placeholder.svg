<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Paper placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#5b7cfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="190" y="92" width="260" height="216" rx="14" fill="#ffffff"/>
    <rect x="210" y="118" width="220" height="10" rx="5" fill="#d6dee9"/>
    <rect x="210" y="142" width="180" height="10" rx="5" fill="#d6dee9"/>
    <rect x="210" y="166" width="200" height="10" rx="5" fill="#d6dee9"/>
    <rect x="210" y="198" width="220" height="10" rx="5" fill="#d6dee9"/>
    <rect x="210" y="222" width="160" height="10" rx="5" fill="#d6dee9"/>
    <rect x="210" y="252" width="220" height="36" rx="18" fill="#eef3ff"/>
    <rect x="220" y="262" width="18" height="18" rx="9" fill="url(#accent)"/>
    <text x="246" y="276" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" font-weight="700" fill="#2b3240">Paper</text>
  </g>
</svg>
